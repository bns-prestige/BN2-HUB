name: Dependency security remediation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/dependency-security.yml", "package.json"]
  schedule:
    - cron: "23 7 * * 1"

permissions:
  contents: write

jobs:
  audit-and-remediate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install and generate lockfile
        run: npm install
      - name: Apply non-breaking security fixes
        run: npm audit fix
        continue-on-error: true
      - name: Capture remaining audit report
        shell: bash
        run: |
          npm audit --json > npm-audit-report.json || true
          node -e "const a=require('./npm-audit-report.json'); const v=a.metadata?.vulnerabilities||{}; console.log('Dependency audit: '+JSON.stringify(v));"
      - name: Update the existing remediation branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git stash push --include-untracked --message dependency-audit-changes
          git checkout -B chore/dependency-security-remediation origin/main
          git stash pop
          git add package-lock.json package.json
          if git diff --cached --quiet; then
            echo "No dependency changes to publish."
            exit 0
          fi
          git commit -m "chore: update dependency lockfile"
          git push --force origin HEAD:refs/heads/chore/dependency-security-remediation
